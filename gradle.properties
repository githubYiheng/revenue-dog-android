org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# SDK 版本号。**必须与 Config.frameworkVersion 一致**（单测 SdkVersionTest 锁定）。
VERSION_NAME=0.1.2
GROUP=org.revdog

# AGP 9 起 Kotlin 支持内置（`android.builtInKotlin`）：我方**用内置集成**，不再 apply
# `org.jetbrains.kotlin.android`（它与 AGP 9 的 new DSL 不兼容，见 `purchases/build.gradle.kts` 头部）。
# @Poko 编译器插件在内置 Kotlin 下可用（M1 起 `./gradlew :purchases:testDebugUnitTest` 即验证）。
android.builtInKotlin=true

# ---- Maven 坐标与 POM 元数据（结构对照 RC `gradle.properties` 的 POM_* 段）----
# 坐标：org.revdog:purchases:<VERSION_NAME>。GROUP 与 VERSION_NAME 在上面。
# 渠道（ADR 0072）：自托管静态 Maven 仓库 https://maven.revdog.org/releases（R2）。
# Gradle 只发到本地 staging 目录，上传与门禁在 `scripts/sdk-android-maven-publish.sh`；
# 这里与 `~/.gradle/gradle.properties` 都**不需要任何发布凭据**。
POM_ARTIFACT_ID=purchases
POM_NAME=RevenueDog Android SDK
POM_DESCRIPTION=Self-hosted in-app purchase backend SDK for Google Play Billing.
POM_URL=https://github.com/githubYiheng/revenue-dog-android
POM_SCM_URL=https://github.com/githubYiheng/revenue-dog-android
POM_SCM_CONNECTION=scm:git:git://github.com/githubYiheng/revenue-dog-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/githubYiheng/revenue-dog-android.git
POM_LICENCE_NAME=The MIT License (MIT)
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=loomalabs
POM_DEVELOPER_NAME=Looma Labs
