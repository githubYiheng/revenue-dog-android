org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# SDK 版本号。**必须与 Config.frameworkVersion 一致**（单测 SdkVersionTest 锁定）。
VERSION_NAME=0.1.0
GROUP=org.revdog

# AGP 9 起 Kotlin 支持内置（`android.builtInKotlin`）。我方显式关掉、继续用 KGP：
# 内置 Kotlin 目前不保证第三方 Kotlin 编译器插件（@Poko）可用，而 @Poko 是
# 「公开面不要 data class」这条铁律的落地手段（考古 §8.4）。AGP 10 移除该开关前重新评估。
android.builtInKotlin=true

# ---- Maven 坐标与 POM 元数据（M4 占位；结构对照 RC `gradle.properties` 的 POM_* 段）----
# 坐标：org.revdog:purchases:<VERSION_NAME>。GROUP 与 VERSION_NAME 在上面。
# **TODO(user)**：发布渠道（GitHub Packages / Maven Central Portal）、账号与凭据由用户定。
# 仓库地址与凭据**绝不入库**，走 `~/.gradle/gradle.properties` 或 `-P` 传入：
#   revdogMavenUrl / revdogMavenUser / revdogMavenPassword
# 三者缺任一时 `publishing.repositories` 不注册该仓库，只留 `publishToMavenLocal`（本地可验产物）。
POM_ARTIFACT_ID=purchases
POM_NAME=RevenueDog Android SDK
POM_DESCRIPTION=Self-hosted in-app purchase backend SDK for Google Play Billing.
POM_URL=https://github.com/githubYiheng/revenue-dog-android
POM_SCM_URL=https://github.com/githubYiheng/revenue-dog-android
POM_SCM_CONNECTION=scm:git:git://github.com/githubYiheng/revenue-dog-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/githubYiheng/revenue-dog-android.git
POM_LICENCE_NAME=The MIT License (MIT)
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=loomalabs
POM_DEVELOPER_NAME=Looma Labs
