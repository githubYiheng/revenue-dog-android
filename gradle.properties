org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# SDK 版本号。**必须与 Config.frameworkVersion 一致**（单测 SdkVersionTest 锁定）。
VERSION_NAME=0.1.0
GROUP=org.revdog

# AGP 9 起 Kotlin 支持内置（`android.builtInKotlin`）。我方显式关掉、继续用 KGP：
# 内置 Kotlin 目前不保证第三方 Kotlin 编译器插件（@Poko）可用，而 @Poko 是
# 「公开面不要 data class」这条铁律的落地手段（考古 §8.4）。AGP 10 移除该开关前重新评估。
android.builtInKotlin=true
